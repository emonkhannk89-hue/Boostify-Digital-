<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Control Center - Boostify Digital</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background: #111827; color: #f9fafb; padding-bottom: 40px; }
    .login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .login-box {
      background: #1f2937;
      padding: 24px;
      border-radius: 12px;
      width: 100%;
      max-width: 360px;
      border: 1px solid #374151;
    }
    .login-box h2 { margin-bottom: 14px; text-align: center; color: #60a5fa; }
    .header {
      background: #1f2937;
      padding: 16px;
      border-bottom: 1px solid #374151;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .container { max-width: 850px; margin: 20px auto; padding: 0 14px; }
    .card {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 18px;
    }
    .card h3 { font-size: 16px; color: #60a5fa; margin-bottom: 12px; border-bottom: 1px solid #374151; padding-bottom: 8px; }
    .form-group { margin-bottom: 10px; }
    label { display: block; font-size: 12.5px; color: #d1d5db; margin-bottom: 4px; }
    input, select {
      width: 100%;
      padding: 9px 10px;
      background: #111827;
      border: 1px solid #4b5563;
      color: #fff;
      border-radius: 6px;
      font-size: 14px;
    }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    @media (max-width: 600px) { .row-3 { grid-template-columns: 1fr; } }
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 7px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      margin-top: 6px;
    }
    .btn-blue { background: #2563eb; color: #fff; }
    .btn-green { background: #16a34a; color: #fff; }
    .btn-red { background: #dc2626; color: #fff; }
    .pkg-box {
      background: #111827;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #374151;
      margin-bottom: 12px;
    }
    .order-card {
      background: #111827;
      padding: 12px;
      border-radius: 8px;
      border-left: 4px solid #16a34a;
      margin-bottom: 10px;
      font-size: 13.5px;
      line-height: 1.5;
    }
    .order-card a { color: #60a5fa; }
    .preview-img { width: 80px; height: 55px; object-fit: cover; border-radius: 5px; margin-top: 5px; border: 1px solid #4b5563; }
    .img-hint { font-size: 11px; color: #9ca3af; margin-top: 2px; }
  </style>
</head>
<body>

  <!-- Login Screen -->
  <div id="loginScreen" class="login-screen">
    <div class="login-box">
      <h2>🔐 Admin Login</h2>
      <div class="form-group">
        <label>অ্যাডমিন পাসওয়ার্ড দিন:</label>
        <input type="password" id="adminPass" placeholder="Password" />
      </div>
      <button class="btn btn-blue" onclick="checkLogin()">লগইন করুন</button>
    </div>
  </div>

  <!-- Admin Dashboard -->
  <div id="dashboard" style="display: none;">
    <div class="header">
      <h2>⚙️ Boostify Control Center</h2>
      <button onclick="logout()" style="background:#dc2626; color:#fff; border:none; padding:6px 12px; border-radius:6px; cursor:pointer;">Logout</button>
    </div>

    <div class="container">
      <!-- Global Settings -->
      <div class="card">
        <h3>💵 ডলার রেট, পেমেন্ট ও WhatsApp নম্বর কন্ট্রোল</h3>
        <div class="row-3">
          <div class="form-group">
            <label>১ ডলার সমান কত টাকা (Rate):</label>
            <input type="number" id="setRate" />
          </div>
          <div class="form-group">
            <label>bKash / Nagad নম্বর:</label>
            <input type="text" id="setPayNum" />
          </div>
          <div class="form-group">
            <label>WhatsApp সাপোর্ট নম্বর:</label>
            <input type="text" id="setWaNum" />
          </div>
        </div>
        <button class="btn btn-green" onclick="saveSettings()">সেটিংস আপডেট করুন</button>
      </div>

      <!-- Packages Control -->
      <div class="card">
        <h3>📦 প্যাকেজ, ছবি আপলোড ও ডিসকাউন্ট কন্ট্রোল</h3>
        <p style="font-size: 12px; color: #fbbf24; margin-bottom: 10px;">💡 ছবির সাইজ টিপস: সুন্দর দেখানোর জন্য <strong>600 × 400 পিক্সেল</strong> সাইজের ছবি আপলোড করুন।</p>
        <div id="adminPkgContainer">লোড হচ্ছে...</div>
        <button class="btn btn-blue" onclick="addNewPackage()">+ নতুন প্যাকেজ যোগ করুন</button>
      </div>

      <!-- Orders List -->
      <div class="card">
        <h3>📩 কাস্টমারদের অর্ডার লিস্ট (<span id="ordCount">0</span>)</h3>
        <div id="adminOrderContainer">অর্ডার লোড হচ্ছে...</div>
      </div>
    </div>
  </div>

  <script>
    const DB_URL = "https://boostify-digital-8ec2d-default-rtdb.firebaseio.com";
    const ADMIN_PASSWORD = "admin1234"; 

    function checkLogin() {
      const pass = document.getElementById("adminPass").value;
      if (pass === ADMIN_PASSWORD) {
        localStorage.setItem("boostify_admin", "true");
        showDashboard();
      } else {
        alert("❌ ভুল পাসওয়ার্ড!");
      }
    }

    function logout() {
      localStorage.removeItem("boostify_admin");
      location.reload();
    }

    if (localStorage.getItem("boostify_admin") === "true") {
      showDashboard();
    }

    async function showDashboard() {
      document.getElementById("loginScreen").style.display = "none";
      document.getElementById("dashboard").style.display = "block";
      loadAdminData();
    }

    async function loadAdminData() {
      const setRes = await fetch(`${DB_URL}/settings.json`);
      const settings = await setRes.json();
      if (settings) {
        document.getElementById("setRate").value = settings.dollarRate || 130;
        document.getElementById("setPayNum").value = settings.paymentNumber || "+8801815395746";
        document.getElementById("setWaNum").value = settings.whatsappNumber || "+8801341282711";
      }

      const pkgRes = await fetch(`${DB_URL}/packages.json`);
      const pkgs = await pkgRes.json() || {};
      const pkgDiv = document.getElementById("adminPkgContainer");
      pkgDiv.innerHTML = "";

      Object.keys(pkgs).forEach(key => {
        const p = pkgs[key];
        pkgDiv.innerHTML += `
          <div class="pkg-box">
            <div class="row-2">
              <div class="form-group">
                <label>প্যাকেজ নাম (বাংলা):</label>
                <input type="text" id="bn_title_${key}" value="${p.title_bn || ''}" />
              </div>
              <div class="form-group">
                <label>Package Name (English):</label>
                <input type="text" id="en_title_${key}" value="${p.title_en || ''}" />
              </div>
            </div>
            <div class="row-2">
              <div class="form-group">
                <label>বিবরণ (বাংলা):</label>
                <input type="text" id="bn_desc_${key}" value="${p.desc_bn || ''}" />
              </div>
              <div class="form-group">
                <label>Description (English):</label>
                <input type="text" id="en_desc_${key}" value="${p.desc_en || ''}" />
              </div>
            </div>
            <div class="row-2">
              <div class="form-group">
                <label>ডলার ($):</label>
                <input type="number" id="dol_${key}" value="${p.dollars || 0}" />
              </div>
              <div class="form-group">
                <label>ডিসকাউন্ট / মাইনাস (টাকা):</label>
                <input type="number" id="disc_${key}" value="${p.discount || 0}" />
              </div>
            </div>
            <div class="form-group">
              <label>ফটো পরিবর্তন করুন (ফাইল সিলেক্ট করুন):</label>
              <input type="file" id="file_${key}" accept="image/*" onchange="convertImage(event, '${key}')" />
              <input type="hidden" id="img_${key}" value="${p.img || ''}" />
              <div class="img-hint">রেকমেন্ডেড সাইজ: 600x400 পিক্সেল</div>
              <img id="prev_${key}" src="${p.img || ''}" class="preview-img" alt="Preview" />
            </div>
            <div class="row-2">
              <button class="btn btn-green" onclick="updatePackage('${key}')">সেভ করুন</button>
              <button class="btn btn-red" onclick="deletePackage('${key}')">ডিলিট করুন</button>
            </div>
          </div>
        `;
      });

      const ordRes = await fetch(`${DB_URL}/orders.json`);
      const orders = await ordRes.json() || {};
      const ordKeys = Object.keys(orders).reverse();
      document.getElementById("ordCount").innerText = ordKeys.length;
      const ordDiv = document.getElementById("adminOrderContainer");

      if (ordKeys.length === 0) {
        ordDiv.innerHTML = "<p>এখনো কোনো অর্ডার আসেনি।</p>";
      } else {
        ordDiv.innerHTML = ordKeys.map(k => {
          const o = orders[k];
          return `
            <div class="order-card">
              <strong>${o.package}</strong> — <span style="color:#4ade80; font-weight:700;">${o.amountTaka} টাকা</span> (${o.time})<br/>
              👤 নাম: ${o.name} | 📞 ফোন: ${o.phone}<br/>
              📌 পেমেন্টের নিয়ম: <b>${o.paymentTiming || 'N/A'}</b><br/>
              💳 পেমেন্ট: ${o.method} (${o.trxInfo})<br/>
              🔗 লিংক: <a href="${o.fbLink}" target="_blank">${o.fbLink}</a><br/>
              <button class="btn btn-red" style="width:auto; padding:5px 12px; margin-top:6px;" onclick="deleteOrder('${k}')">অর্ডার ডিলিট করুন</button>
            </div>
          `;
        }).join("");
      }
    }

    function convertImage(event, key) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const base64String = e.target.result;
        document.getElementById(`img_${key}`).value = base64String;
        document.getElementById(`prev_${key}`).src = base64String;
        alert("✅ ছবি সিলেক্ট করা হয়েছে! এখন নিচে 'সেভ করুন' বাটনে ক্লিক করুন।");
      };
      reader.readAsDataURL(file);
    }

    async function saveSettings() {
      const dollarRate = Number(document.getElementById("setRate").value);
      const paymentNumber = document.getElementById("setPayNum").value.trim();
      const whatsappNumber = document.getElementById("setWaNum").value.trim();
      await fetch(`${DB_URL}/settings.json`, {
        method: "PUT",
        body: JSON.stringify({ dollarRate, paymentNumber, whatsappNumber })
      });
      alert("✅ সেটিংস সফলভাবে আপডেট হয়েছে!");
    }

    async function updatePackage(key) {
      const data = {
        title_bn: document.getElementById(`bn_title_${key}`).value,
        title_en: document.getElementById(`en_title_${key}`).value,
        desc_bn: document.getElementById(`bn_desc_${key}`).value,
        desc_en: document.getElementById(`en_desc_${key}`).value,
        dollars: Number(document.getElementById(`dol_${key}`).value),
        discount: Number(document.getElementById(`disc_${key}`).value),
        img: document.getElementById(`img_${key}`).value
      };
      await fetch(`${DB_URL}/packages/${key}.json`, {
        method: "PUT",
        body: JSON.stringify(data)
      });
      alert("✅ প্যাকেজ ও ছবি সফলভাবে আপডেট হয়েছে!");
    }

    async function addNewPackage() {
      const newPkg = {
        title_bn: "নতুন প্যাকেজ ($১৫)",
        title_en: "New Package ($15)",
        desc_bn: "প্যাকেজের বিবরণ লিখুন",
        desc_en: "Write package description",
        dollars: 15,
        discount: 0,
        img: "https://images.unsplash.com/photo-1611162617474-5b21e879e113?w=600&q=80"
      };
      await fetch(`${DB_URL}/packages.json`, {
        method: "POST",
        body: JSON.stringify(newPkg)
      });
      loadAdminData();
    }

    async function deletePackage(key) {
      if (confirm("আপনি কি এই প্যাকেজটি ডিলিট করতে চান?")) {
        await fetch(`${DB_URL}/packages/${key}.json`, { method: "DELETE" });
        loadAdminData();
      }
    }

    async function deleteOrder(key) {
      if (confirm("আপনি কি এই অর্ডারটি ডিলিট করতে চান?")) {
        await fetch(`${DB_URL}/orders/${key}.json`, { method: "DELETE" });
        loadAdminData();
      }
    }
  </script>
</body>
</html>
